[project]
name = "copperline-local-gateway"
version = "0.1.0"
description = "Local-only stand-in for ONE XC HTTP load balancer (routes, JWT, service policy, header changes). NOT XC."
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_gateway"]
