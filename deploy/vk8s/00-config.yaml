# Agent configs and shared data. Generated by: scripts/render_manifests.py (from config/agents/*.yaml, config/tools/tools.yaml,
# config/personas.yaml). This file shows the shape only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-configs
data:
  shopper.yaml: "# rendered from config/agents/shopper.yaml"
  storeops.yaml: "# rendered"
  refunds.yaml: "# rendered"
  insights-nightly.yaml: "# rendered"
  tools.yaml: "# rendered from config/tools/tools.yaml"
  personas.yaml: "# rendered from config/personas.yaml"
  tool-access-matrix.yaml: "# rendered from config/policy/tool-access-matrix.yaml (idp: allowed_user_roles; mcp-servers: defense-in-depth check)"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-env
data:
  TOOLS_BASE_URL: "http://tools.agentic-demo"
  LLM_BASE_URL: "http://llm.agentic-demo"
  IDP_BASE_URL: "http://idp.agentic-demo"
  ERP_BASE_URL: "http://erp.agentic-demo"     # resolvable on CE only (by design)
  MCP_PROTOCOL_VERSION: "2026-07-28"
  DEMO_SAFE_MODE: "true"
  LOG_LEVEL: "info"
