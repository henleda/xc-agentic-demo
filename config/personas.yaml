# Demo users. IdP /auth/demo-login issues user tokens for these subs only.
# For personas with salted: true, /auth/demo-login appends "-<run_salt>" (request parameter) to the sub,
# so malicious-user state never carries over between runs. Object-level checks strip the suffix.
personas:
  - { sub: alex.rivera,  name: Alex Rivera,  role: customer,        audiences: [copperline-shop], customer_id: C-1001 }
  - { sub: mallory.x,    name: Mallory,      role: customer,        audiences: [copperline-shop], customer_id: C-1066, salted: true }
  - { sub: jordan.lee,   name: Jordan Lee,   role: store_associate, audiences: [copperline-ops],  store_id: S-012 }
  - { sub: sam.patel,    name: Sam Patel,    role: care_agent,      audiences: [copperline-ops] }
  - { sub: morgan.chen,  name: Morgan Chen,  role: care_supervisor, audiences: [copperline-ops] }
clients:
  # client_credentials clients. Secrets are generated by scripts/render_secrets.py, never committed.
  - { client_id: agent-shopper,   kind: agent,   agent_id: shopper,  agent_role: shopper }
  - { client_id: agent-storeops,  kind: agent,   agent_id: storeops, agent_role: storeops }
  - { client_id: agent-refunds,   kind: agent,   agent_id: refunds,  agent_role: refunds }
  - { client_id: svc-mcp,         kind: service, sub: mcp-servers, svc_role: tool-server, audiences: [copperline-erp] }
  - { client_id: granite-supply,  kind: partner, sub: granite-supply, role: partner, audiences: [copperline-partner] }
  # Latency bench (scripts/measure_latency.py). Not a demo actor. Gets a USER-style token for a synthetic
  # customer so it passes the shopper rules exactly like real traffic; one per RE so rate limits don't collide.
  - { client_id: bench, kind: bench, sub_prefix: bench-, role: customer, audiences: [copperline-shop] }
