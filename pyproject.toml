# Dev workspace root. Not a deployable package: each service under services/ has its own
# pyproject.toml and Dockerfile. `uv sync` here installs every service plus test tooling into
# one .venv so `make check` can lint and test everything together.
[project]
name = "copperline-demo"
version = "0.1.0"
description = "Copperline Outfitters agentic AI demo on F5 Distributed Cloud (dev workspace root)"
requires-python = "==3.12.*"
dependencies = ["pyyaml>=6.0", "copperline-common", "copperline-idp"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mcp==2.3.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/common", "services/idp"]

[tool.uv.sources]
copperline-common = { workspace = true }
copperline-idp = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["scripts"]
testpaths = ["scripts/tests", "services", "deploy/local"]
markers = ["interop: talks to a real localhost server with the official MCP SDK client (dev only)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
