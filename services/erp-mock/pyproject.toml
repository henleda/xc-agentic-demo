[project]
name = "copperline-erp-mock"
version = "0.1.0"
description = "Copperline's mock ERP (system of record): business API on 8081, loopback-only admin API on 8181"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erp_mock"]  # includes erp_mock/seed.sql
