[project]
name = "copperline-ai-gw"
version = "0.1.0"
description = "Copperline's own AI gateway in front of Bedrock (EC2): route map, API key, token budgets, stub mode"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_gw"]  # includes ai_gw/stub_replies.yaml
