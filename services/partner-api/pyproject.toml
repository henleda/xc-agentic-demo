[project]
name = "copperline-partner-api"
version = "0.1.0"
description = "Copperline's API for Granite Supply: 3 documented operations plus 2 shadow endpoints (S6)"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partner_api"]
