[project]
name = "copperline-common"
version = "0.1.0"
description = "Shared library for Copperline demo services (logging, request IDs, JWT, MCP, scenario plans)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copperline_common"]
