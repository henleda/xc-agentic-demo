[project]
name = "copperline-cockpit"
version = "0.1.0"
description = "The presenter's cockpit: persona chat, live trace, scenario buttons, partner tab and estate panel"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cockpit"]  # includes cockpit/static/index.html
