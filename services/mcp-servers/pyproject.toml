[project]
name = "copperline-mcp-servers"
version = "0.1.0"
description = "Copperline MCP tool servers (catalog, orders, inventory, refunds); one image, MCP_SERVER picks which"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers"]

# catalog.json lives in data/ (shared with gen_seed_data.py); ship it inside the package.
[tool.hatch.build.targets.wheel.force-include]
"data/catalog.json" = "mcp_servers/data/catalog.json"
