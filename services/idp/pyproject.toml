[project]
name = "copperline-idp"
version = "0.1.0"
description = "Demo identity provider for the Copperline agentic demo: mints the RS256 JWTs every hop is judged by"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idp"]
