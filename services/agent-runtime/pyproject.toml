[project]
name = "copperline-agent-runtime"
version = "0.1.0"
description = "One runtime for every Copperline agent (shopper, storeops, refunds) and the insights-nightly batch job"
requires-python = "==3.12.*"
dependencies = [
    "copperline-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
copperline-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
